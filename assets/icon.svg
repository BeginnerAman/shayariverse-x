<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b29"/>
      <stop offset="50%" stop-color="#090814"/>
      <stop offset="100%" stop-color="#040916"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7209b7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Inner Card Gradient -->
    <linearGradient id="innerCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Star Fill Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d4f6ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
  </defs>

  <!-- Dark Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>

  <!-- Glass Border Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Inner Frosted Glass Card -->
  <rect x="72" y="72" width="368" height="368" rx="76" fill="url(#innerCardGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

  <!-- 4-Point Star Sparkle Brand Mark -->
  <g transform="translate(256, 256) scale(11.5) translate(-12, -12)">
    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"
          fill="url(#starGrad)"
          stroke="#ffffff"
          stroke-width="0.8"
          stroke-linejoin="round"/>
  </g>
</svg>
