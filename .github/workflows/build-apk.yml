name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android
          node scripts/sync-version.js

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.1.4.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.1.4-APK
          path: build-artifacts/ShayariVerse-X-v1.1.4.apk
          retention-days: 30

      - name: Publish GitHub Release v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.4 --yes || true
          gh release create v1.1.4 build-artifacts/ShayariVerse-X-v1.1.4.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X v1.1.4" \
            --notes "### ShayariVerse X v1.1.4 Release Notes
          - **Native Android Version Sync (v1.1.4)**: Synchronized Android Gradle versionName and versionCode with app runtime version, ensuring system settings and package installer reflect v1.1.4.
          - **0ms Event Listener Deduping**: Eliminated duplicate click listener registrations across feed and profile cards, resolving rapid like/unlike toggling.
          - **Double-Tap Tactile Heart UX**: Double-tapping a card now reliably displays the heart burst animation without inadvertently unliking previously liked couplets.
          - **UI Sanitization & Session Hardening**: Hardened profile and couplet card rendering protections and scoped admin actions strictly to active founder sessions with automatic logout cleanup."
