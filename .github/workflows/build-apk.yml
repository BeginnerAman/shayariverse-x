name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android
          node scripts/sync-version.js

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-artifacts/ShayariVerse-X-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-APK
          path: build-artifacts/ShayariVerse-X-Latest.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ env.APP_TAG }} --yes || true
          gh release create ${{ env.APP_TAG }} build-artifacts/ShayariVerse-X-${{ env.APP_TAG }}.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X ${{ env.APP_TAG }}" \
            --notes "### ShayariVerse X ${{ env.APP_TAG }} Release Notes
          - **Fully Interactive Notification & Lock Screen Controls**: Fixed media notification action buttons (Play, Pause, Next Track, Previous Track) with direct Service PendingIntents so controls work instantly even when phone is locked or app is in background.
          - **Custom Brand Cover Artwork**: Automatically displays the official glowing ShayariVerse X star artwork instead of the generic Android MP3 disc/plate placeholder icon.
          - **Fixed Repeated Update Popups**: Resolved version discrepancy in runtime config and added smart dismissal memory so update dialog never annoys users on startup once dismissed.
          - **100% Silent Seamless Track Transitions**: Zero notification chime, beep, sound, or vibration when tracks change or playlists advance (IMPORTANCE_LOW, silent channel, and onlyAlertOnce).
          - **Continuous Non-Stop Background Playback**: Native Android MediaSession Foreground Service with Android 14 mediaPlayback compliance, ensuring audio never cuts out after 5 minutes in background or with screen locked.
          - **Curated 268-Song Catalog**: High-fidelity streaming across the entire background score library with zero broken links."
