name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.0.2-APK
          path: build-artifacts/ShayariVerse-X-v1.0.2.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.2 --yes || true
          gh release create v1.0.2 build-artifacts/ShayariVerse-X-v1.0.2.apk \
            --title "ShayariVerse X v1.0.2" \
            --notes "### ShayariVerse X v1.0.2 Release Notes
          - **In-App Update Alert**: Integrated automatic background & manual check for new releases with 1-tap direct update prompt.
          - **Tablet & Large Screen Ergonomics**: Responsive layout (680px width), centered floating dock bottom navigation, and floating dialog modals for iPad & Android Tablets.
          - **No Dev Placeholder Text**: Removed initial 'Phase 1 Core Shell Loaded' text permanently; displays fresh canvas immediately.
          - **Poetic Bio UI Perfected**: Dedicated 16px rounded card alignment eliminates capsule squeeze distortion & resize grip.
          - **Post Delete Empty-State Fix**: Real-time re-render of 'A Fresh Canvas Awaits' prevents black screen when deleting the last post.
          - **Single-Line Toast Alignment**: Horizontally centered, non-wrapping glowing pill toast notifications.
          - **Polished Bottom Nav Glow**: Softer 32px ambient neon bar with micro-bounce tab physics."
