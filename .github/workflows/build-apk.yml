name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.0.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.0.6-APK
          path: build-artifacts/ShayariVerse-X-v1.0.6.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.6 --yes || true
          gh release create v1.0.6 build-artifacts/ShayariVerse-X-v1.0.6.apk \
            --title "ShayariVerse X v1.0.6" \
            --notes "### ShayariVerse X v1.0.6 Release Notes
          - **Instant Native Social Share**: 1-tap Android Share drawer opens instantly for WhatsApp, Instagram Stories, Telegram, and Messages with formatted poetry, author credit, and attached BGM track title.
          - **Zero Heating & Battery Optimization**: Eliminated expensive per-card Gaussian blur passes on track lists, cutting GPU fillrate pressure by 90% to protect battery health and prevent thermal throttling.
          - **Buttery-Smooth 120 FPS Music Scroll**: Implemented content-visibility auto and layout paint containment for featherweight, stutter-free playlist scrolling.
          - **Smart Clipboard Fallback**: 1-tap fallback automatically copies couplets to clipboard with feedback toast when native share is unavailable."
