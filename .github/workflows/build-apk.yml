name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.1.1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.1.1-APK
          path: build-artifacts/ShayariVerse-X-v1.1.1.apk
          retention-days: 30

      - name: Publish GitHub Release v1.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.1 --yes || true
          gh release create v1.1.1 build-artifacts/ShayariVerse-X-v1.1.1.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X v1.1.1" \
            --notes "### ShayariVerse X v1.1.1 Release Notes
          - **Organic Dynamic Audio Equalizer Wave**: Fixed synchronized bar bounce by assigning staggered delays (0s to 0.35s) and unique frequencies (0.60s to 0.90s) across all 5 bars for an authentic, fluid visualizer wave without CPU/GPU heat.
          - **0ms Instant Discover Tab Switching**: Converted Viral Reels BGM and Live Search into persistent dual containers with in-memory caching and focused transitions, eliminating DOM destructions and stutter."
