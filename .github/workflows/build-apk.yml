name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.0.3-APK
          path: build-artifacts/ShayariVerse-X-v1.0.3.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.3 --yes || true
          gh release create v1.0.3 build-artifacts/ShayariVerse-X-v1.0.3.apk \
            --title "ShayariVerse X v1.0.3" \
            --notes "### ShayariVerse X v1.0.3 Release Notes
          - **Single-Toast Policy & Debounced Update Check**: Tapping 'Check for Updates' repeatedly no longer stacks toasts; previous toasts are cleared immediately with button debouncing & animated spinner feedback.
          - **Minimal & Clean Bottom Navigation**: Removed horizontal neon indicator bar line entirely for a sleek, distraction-free aesthetic with glowing cyan active icons.
          - **Compact Circular Mood Swatches**: Replaced cut-off text pills with 6 luminous circular color spheres (Cyber Purple, Midnight Cyan, Crimson Rose, Golden Amber, Emerald Mint, Obsidian Noir) that fit all screen widths with zero clipping.
          - **Symmetric Segmented Typography**: Replaced uneven font pills with a 3-column equal-width glass grid (Nastaliq, Elegant, Modern) for balanced alignment on mobile and tablet."
