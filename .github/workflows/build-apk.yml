name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.0.4-APK
          path: build-artifacts/ShayariVerse-X-v1.0.4.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.4 --yes || true
          gh release create v1.0.4 build-artifacts/ShayariVerse-X-v1.0.4.apk \
            --title "ShayariVerse X v1.0.4" \
            --notes "### ShayariVerse X v1.0.4 Release Notes
          - **Permanent Keystore & Seamless Updates**: Integrated a fixed signing certificate across CI builds, permanently eliminating package conflict errors during future updates.
          - **Sticky Top Bar & Modal Headers**: App brand header and composer action buttons remain pinned at the top during scrolling with frosted liquid glass blur.
          - **1-Tap Clipboard Paste**: Added a dedicated Paste button to the composer toolbar and restored native long-press text selection.
          - **Tablet Ergonomics**: Expanded floating dock navigation to 620px with spacious 88px touch zones for balanced tablet usability.
          - **Center-Aligned + Create Button**: Centered with mathematical symmetry and elevated with dual-tone purple-cyan glowing liquid aura.
          - **Buttery-Smooth Zero Battery Drain**: Hardware-accelerated ambient meshes and content-visibility optimization for locked 120 FPS scrolling."
