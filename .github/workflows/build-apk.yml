name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.0.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.0.5-APK
          path: build-artifacts/ShayariVerse-X-v1.0.5.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.5 --yes || true
          gh release create v1.0.5 build-artifacts/ShayariVerse-X-v1.0.5.apk \
            --title "ShayariVerse X v1.0.5" \
            --notes "### ShayariVerse X v1.0.5 Release Notes
          - **Sticky Discover Header & Engine Switcher**: Dual Viral Music Engine title and mode tabs remain seamlessly pinned below the brand bar during playlist scrolling with liquid frosted glass backdrop blur.
          - **Single-Line Track Badges**: Enforced single-line badge rendering and consistent horizontal alignment across all 18 viral BGM tracks, eliminating line wrapping on long song titles.
          - **Refined Composer Toolbar**: Streamlined Auto-Format action with an ultra-clean glass pill design and replaced bulky pill badges with an elegant, discreet font size micro-indicator.
          - **Zero Battery Drain 120 FPS Physics**: Unlocked native hardware-accelerated viewport sticky behavior across all mobile and tablet screens."
