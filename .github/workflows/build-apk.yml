name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.1.3.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.1.3-APK
          path: build-artifacts/ShayariVerse-X-v1.1.3.apk
          retention-days: 30

      - name: Publish GitHub Release v1.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.3 --yes || true
          gh release create v1.1.3 build-artifacts/ShayariVerse-X-v1.1.3.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X v1.1.3" \
            --notes "### ShayariVerse X v1.1.3 Release Notes
          - **Professional UI Copy Polish**: Replaced dramatic phrases with clean, modern English across deletion dialogs, toast feedback, and placeholders.
          - **Clean Comment Experience**: Standardized comment drawer title to 'Comments', input placeholder to 'Write a comment...', and notification toast to 'Comment posted!'.
          - **Intuitive Feedback & Composer**: Updated post publishing toast to 'Shayari published!' and enhanced empty state and live composer guidance."
