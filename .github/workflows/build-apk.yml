name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.0.7.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.0.7-APK
          path: build-artifacts/ShayariVerse-X-v1.0.7.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.7 --yes || true
          gh release create v1.0.7 build-artifacts/ShayariVerse-X-v1.0.7.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X v1.0.7" \
            --notes "### ShayariVerse X v1.0.7 Release Notes
          - **Outline Line-Art Typography**: Upgraded social share text with classic monochrome outline symbols (♫, ✧, —), completely eliminating childish colored emojis for an editorial aesthetic.
          - **Direct 1-Tap APK Download Links**: Replaced confusing repository code links with instant 1-tap APK direct download URLs in shared poetry cards.
          - **Equalizer Hardware Compositor Optimization**: Migrated audio equalizer bar animations from layout-reflow height to GPU transform scaleY, reducing CPU playback thermal load to near zero.
          - **Verified Badge Compositor Optimization**: Replaced infinite software drop-shadow rasterization with GPU transform scaling, preventing background battery drain.
          - **Streamlined Frosted Glass Shaders**: Optimized liquid frosted glass shaders by trimming redundant color-matrix saturation passes, keeping devices cool and battery healthy."
