name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android
          node scripts/sync-version.js

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-artifacts/ShayariVerse-X-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-APK
          path: build-artifacts/ShayariVerse-X-Latest.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ env.APP_TAG }} --yes || true
          gh release create ${{ env.APP_TAG }} build-artifacts/ShayariVerse-X-${{ env.APP_TAG }}.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X ${{ env.APP_TAG }}" \
            --notes "### ShayariVerse X ${{ env.APP_TAG }} Release Notes
          - **Background Audio Playback & Quick Glass Popup**: Press & hold the Discover mini player to toggle seamless background audio playback, allowing tracks to keep playing when the app is minimized or the screen is locked.
          - **Android Lock Screen & Notification Center Player**: Integrated the MediaSession API with real-time metadata, artwork, and playback controls directly on your phone's lock screen and notification shade.
          - **Logged-In Author Identity Synchronization**: Live Card Preview in the composer dynamically displays the author's real Avatar initials, Display Name, and @handle.
          - **100% Verified Playable BGM Engine**: Exclusively streams verified, live-playable tracks across the 268-song curated audio catalog with zero broken links.
          - **Studio-Grade Modal Backdrop & Interactive Audio Auditioning**: Obsidian glass with 24px backdrop blur, tap-to-preview audio pills, and one-tap BGM detach."
