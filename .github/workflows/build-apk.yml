name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android
          node scripts/sync-version.js

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-artifacts/ShayariVerse-X-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-APK
          path: build-artifacts/ShayariVerse-X-Latest.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ env.APP_TAG }} --yes || true
          gh release create ${{ env.APP_TAG }} build-artifacts/ShayariVerse-X-${{ env.APP_TAG }}.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X ${{ env.APP_TAG }}" \
            --notes "### ShayariVerse X ${{ env.APP_TAG }} Release Notes
          - **Professional Android Gesture and Hardware Back Navigation**: Back gesture and physical button now seamlessly dismiss active dialogs, bottom sheets, composer, and sub-views first, returning to the home feed before smooth app minimization.
          - **Optimized Social Interaction Gate**: Refined like interaction state handling for guest sessions, ensuring count updates reflect verified user actions accurately.
          - **Curated 199-Track Poetic Music Catalog**: High-speed CDN audio streaming across 5 distinct mood categories with seamless couplet looping and silky fades.
          - **Ultra-Lightweight APK (~4.5 MB)**: Optimized web bundle with cloud-hosted audio keeps storage footprint ultra-lean."
