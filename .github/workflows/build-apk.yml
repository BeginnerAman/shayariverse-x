name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.0.9.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.0.9-APK
          path: build-artifacts/ShayariVerse-X-v1.0.9.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.9 --yes || true
          gh release create v1.0.9 build-artifacts/ShayariVerse-X-v1.0.9.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X v1.0.9" \
            --notes "### ShayariVerse X v1.0.9 Release Notes
          - **Official Direct JioSaavn Engine**: Restored live Indian & Bollywood music search via JioSaavn official engine with native CapacitorHttp support for unthrottled audio previews.
          - **Total Zero-Heat GPU Optimization**: 100% purged all remaining backdrop-filter blur passes across top bar, bottom nav, and audio pills, slashing GPU draw calls to baseline idle and eliminating device heating.
          - **0ms Optimistic UI Engine**: Post creation, heart likes, comments, and couplet editing reflect immediately in 0ms with in-place DOM mutation, eliminating full-page reloads and flicker.
          - **Professional Offline Mode & Auto-Reconnect**: Persistent local caching ensures feed and profile never display blank states or 0 posts when offline, paired with a sleek offline pill and instant auto-sync when internet reconnects."
