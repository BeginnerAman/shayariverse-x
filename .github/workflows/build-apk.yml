name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ShayariVerse X APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets into dist/
        run: npm run build

      - name: Add Android Platform & Generate Brand Icons
        run: |
          npx cap add android || echo "Android platform already added."
          npm install -D sharp
          node scripts/generate-icons.js
          npx cap sync android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-v1.1.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ShayariVerse-X-Latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShayariVerse-X-v1.1.0-APK
          path: build-artifacts/ShayariVerse-X-v1.1.0.apk
          retention-days: 30

      - name: Publish GitHub Release v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.0 --yes || true
          gh release create v1.1.0 build-artifacts/ShayariVerse-X-v1.1.0.apk build-artifacts/ShayariVerse-X-Latest.apk \
            --title "ShayariVerse X v1.1.0" \
            --notes "### ShayariVerse X v1.1.0 Release Notes
          - **Instant In-Place Couplet Editing**: Fixed DOM auto-fit sizing reference so edited couplets reflect instantly on screen in 0ms without requiring an app restart.
          - **Zero-Flicker Synchronous Feed Startup**: Purged static empty placeholder cards from the initial HTML stream; feed loads cached couplets in 0ms on startup for a seamless experience.
          - **Bidirectional Cross-Tab Like Synchronization**: Synchronized heart likes and counts across Feed and Profile views simultaneously, ensuring accurate glow states and preventing accidental unlikes.
          - **Featherweight GPU Tuning & content-visibility Engine**: Added content-visibility layout containment for offscreen cards and eliminated paused equalizer compositor layers for zero-heat performance."
